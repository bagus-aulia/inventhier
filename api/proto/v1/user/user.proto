syntax = "proto3";
package user_v1_grpc;
option go_package = "internal/adapters/client/grpc/user";
 
message Data {
    int32 status = 1;
    User data = 2;
    Error error = 3;
}
 
message Error {
    string message = 1;
    string reason = 2;
}

message User {
    string uuid = 1;
    string name = 2;
    string avatar = 3;
    string position = 4;
}

message Params {
    string uuid = 1;
}

service UserV1Handler {
    rpc GetUser(Params) returns (Data);
}